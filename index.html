<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">

<title>Home Print</title>
<!-- milessic-themes bundle + helper, rendered by main.py from STYLES_URL (see SETUP.md).
     App styles below must load AFTER it and use only the public tokens. -->
{{THEME_HEAD}}
<style>
  /* App-only widgets. Tokens only (milessic-themes manifesto §5/§6). */
  .print-layout {
    display: grid;
    grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
    gap: 1rem;
    align-items: start;
  }
  .print-layout > .card { margin-bottom: 0; }
  @media (max-width: 780px) {
    .print-layout { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- Left column: upload + file list + controls ---------- */
  .dropzone {
    border: 2px dashed var(--line-strong);
    border-radius: calc(var(--radius) / 2);
    padding: 1.75rem .75rem;
    text-align: center;
    color: var(--ink-2);
    cursor: pointer;
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--surface-2);
  }
  #fileInput { display: none; }

  .file-list-wrap { max-height: 300px; overflow-y: auto; }
  .file-name { overflow-wrap: anywhere; }
  .file-stored { overflow-wrap: anywhere; }
  table.data tbody tr { cursor: pointer; }

  .rotate-row { justify-content: space-between; }

  .preview-card {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 520px;
    overflow: hidden;
  }
  .preview-media {
    max-width: 100%;
    max-height: 640px;
    border: 1px solid var(--line);
    background: var(--surface);
    transition: transform .15s ease;
  }
  iframe.preview-media { width: 100%; height: 640px; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">Home Print</a>
  <nav class="nav">
    <a href="/" class="active">Print</a>
  </nav>
  <div class="topbar-end">
    <span id="statusBadge" class="badge tone-neutral" style="display:none;" title="">checking…</span>
    <span id="whoami" class="muted"></span>
    <a id="homeBtn" class="btn ghost small" href="{{HOME_URL}}">Home</a>
    <button id="themeBtn" class="btn ghost small" type="button" aria-expanded="false" aria-controls="themeCard" style="display:none;">Theme</button>
    <button id="logoutBtn" class="btn ghost small" type="button" style="display:none;">Log out</button>
  </div>
</header>

<main class="container">
  <section class="card" id="themeCard" style="display:none;">
    <div class="section-head">
      <h2>Theme</h2>
      <button id="themeCloseBtn" class="btn ghost small" type="button">Close</button>
    </div>
    <div id="themePicker"><span class="muted">Loading themes…</span></div>
  </section>

  <section class="card narrow" id="loginCard" style="display:none;">
    <h2>Log in</h2>
    <form id="loginForm" class="stack">
      <label>Username
        <input type="text" id="loginUser" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </label>
      <div class="flash error" id="loginError" role="alert" style="display:none;"></div>
      <div class="toolbar"><button type="submit" class="btn primary">Log in</button></div>
    </form>
  </section>

  <div class="print-layout" id="app" style="display:none;">
    <section class="card stack">
      <div class="dropzone" id="dropzone" role="button" tabindex="0">
        Drag &amp; drop a file here<br>or click to browse<br>
        <span class="small muted">(PDF, PNG, JPG, TXT)</span>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.txt">

      <div class="filters">
        <label>Status
          <select id="filterProcessed">
            <option value="all">All</option>
            <option value="unprocessed">Not printed</option>
            <option value="processed">Printed</option>
          </select>
        </label>
        <label>From
          <input type="date" id="filterFrom">
        </label>
        <label>To
          <input type="date" id="filterTo">
        </label>
      </div>

      <div class="file-list-wrap scroll-x">
        <table class="data selectable">
          <thead>
            <tr><th>File</th><th>Status</th><th class="actions"><span class="muted">Actions</span></th></tr>
          </thead>
          <tbody id="fileList"></tbody>
        </table>
      </div>

      <div class="row rotate-row">
        <span>Rotate</span>
        <div class="row">
          <button id="rotateLeft" class="btn small" type="button" title="Rotate left" aria-label="Rotate left">⟲</button>
          <button id="rotateRight" class="btn small" type="button" title="Rotate right" aria-label="Rotate right">⟳</button>
        </div>
      </div>
      <div class="inline-form">
        <label>Paper size
          <select id="paperSelect">
            <option value="A4">A4</option>
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
          </select>
        </label>
        <label>Copies
          <input type="number" id="copiesInput" value="1" min="1" max="50">
        </label>
      </div>

      <button id="printBtn" class="btn primary" type="button" disabled>Print</button>
      <div id="printMessage" class="flash" role="status" style="display:none;"></div>
    </section>

    <section class="card preview-card" id="previewPanel">
      <div id="previewEmpty" class="muted">Upload a file to preview it here.</div>
      <iframe id="previewFrame" class="preview-media" style="display:none;"></iframe>
      <img id="previewImage" class="preview-media" alt="Preview" style="display:none;">
    </section>
  </div>
</main>

<script>
(function () {
  const AUTH_KEY = "ps_auth"; // base64("username:password") in localStorage

  const loginForm = document.getElementById("loginForm");
  const loginUser = document.getElementById("loginUser");
  const loginPass = document.getElementById("loginPass");
  const loginError = document.getElementById("loginError");
  const loginCard = document.getElementById("loginCard");
  const whoami = document.getElementById("whoami");
  const logoutBtn = document.getElementById("logoutBtn");
  const homeBtn = document.getElementById("homeBtn");
  const app = document.getElementById("app");

  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const fileListEl = document.getElementById("fileList");
  const filterProcessed = document.getElementById("filterProcessed");
  const filterFrom = document.getElementById("filterFrom");
  const filterTo = document.getElementById("filterTo");

  const rotateLeftBtn = document.getElementById("rotateLeft");
  const rotateRightBtn = document.getElementById("rotateRight");
  const paperSelect = document.getElementById("paperSelect");
  const copiesInput = document.getElementById("copiesInput");
  const printBtn = document.getElementById("printBtn");
  const printMessage = document.getElementById("printMessage");

  const previewEmpty = document.getElementById("previewEmpty");
  const previewFrame = document.getElementById("previewFrame");
  const previewImage = document.getElementById("previewImage");

  const statusBadge = document.getElementById("statusBadge");

  // HOME_URL is rendered in by main.py; hide the button when it isn't set.
  if (!homeBtn.getAttribute("href")) homeBtn.style.display = "none";

  // ---------- theme picker (milessic-themes helper) ----------
  // Only offered when themes.js loaded (STYLES_URL set and server reachable).

  const themeBtn = document.getElementById("themeBtn");
  const themeCard = document.getElementById("themeCard");
  const themeCloseBtn = document.getElementById("themeCloseBtn");
  const themePicker = document.getElementById("themePicker");
  let themePickerMounted = false;

  function setThemeCardOpen(open) {
    themeCard.style.display = open ? "" : "none";
    themeBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open && !themePickerMounted) {
      themePickerMounted = true;
      window.MilessicThemes.mountPicker(themePicker).catch(() => {
        themePickerMounted = false;
        themePicker.textContent = "Could not load themes. Try again later.";
      });
    }
  }

  if (window.MilessicThemes) {
    themeBtn.style.display = "";
    themeBtn.addEventListener("click", () => setThemeCardOpen(themeCard.style.display === "none"));
    themeCloseBtn.addEventListener("click", () => setThemeCardOpen(false));
  }

  let files = [];          // {id, filename, type}
  let selectedFile = null; // one of the above
  let rotation = 0;
  let statusTimer = null;
  let fileListTimer = null;

  // ---------- auth helpers ----------

  function getAuth() {
    return localStorage.getItem(AUTH_KEY);
  }

  function authHeaders() {
    const a = getAuth();
    return a ? { "Authorization": "Basic " + a } : {};
  }

  function authQuery() {
    const a = getAuth();
    return a ? ("?auth=" + encodeURIComponent(a)) : "";
  }

  // Best-effort extraction of an error message from a failed response.
  // Server errors (5xx) get a "contact administrator" hint appended, since
  // at that point there's nothing the user themself can do about it (e.g.
  // the server hit a filesystem permission error on uploads/ - see
  // SETUP.md's "Permission denied" section).
  async function extractError(res, fallback) {
    let message = fallback || `Request failed (HTTP ${res.status})`;
    try {
      const data = await res.json();
      if (data && data.error) message = data.error;
    } catch (err) { /* body wasn't JSON */ }
    if (res.status >= 500) message += " Please contact Administrator.";
    return message;
  }

  async function tryLogin(username, password) {
    const token = btoa(username + ":" + password);
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Authorization": "Basic " + token },
    });
    if (!res.ok) {
      const message = res.status >= 500
        ? await extractError(res, "Login failed")
        : "Invalid username or password";
      return { error: message };
    }
    const data = await res.json();
    return { token, username: data.username };
  }

  function setLoginError(message) {
    loginError.textContent = message || "";
    loginError.style.display = message ? "" : "none";
  }

  // kind: "success" | "error" | "info"; empty text hides the message.
  function setPrintMessage(kind, text) {
    printMessage.className = "flash " + (kind || "info");
    printMessage.textContent = text || "";
    printMessage.style.display = text ? "" : "none";
  }

  function showApp(username) {
    loginCard.style.display = "none";
    statusBadge.style.display = "";
    logoutBtn.style.display = "";
    whoami.textContent = username;
    app.style.display = "";
    startStatusPolling();
    startFileListPolling();
  }

  function showLogin(message) {
    loginCard.style.display = "";
    statusBadge.style.display = "none";
    logoutBtn.style.display = "none";
    whoami.textContent = "";
    app.style.display = "none";
    stopStatusPolling();
    stopFileListPolling();
    if (message) setLoginError(message);
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    setLoginError("");
    const u = loginUser.value.trim();
    const p = loginPass.value;
    if (!u || !p) return;
    const result = await tryLogin(u, p);
    if (result.error) {
      setLoginError(result.error);
      return;
    }
    localStorage.setItem(AUTH_KEY, result.token);
    loginPass.value = "";
    showApp(result.username);
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem(AUTH_KEY);
    showLogin();
  });

  // On load: if we have stored credentials, verify them silently.
  (async function init() {
    const stored = getAuth();
    if (!stored) { showLogin(); return; }
    try {
      const decoded = atob(stored);
      const [u] = decoded.split(":");
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Authorization": "Basic " + stored },
      });
      if (res.ok) {
        showApp(u);
      } else if (res.status >= 500) {
        // Server-side problem, not a bad credential - keep the stored
        // credentials and let the user retry instead of logging them out.
        showLogin(await extractError(res, "Could not reach server"));
      } else {
        localStorage.removeItem(AUTH_KEY);
        showLogin("Session expired, please log in again");
      }
    } catch (err) {
      showLogin("Could not reach server");
    }
  })();

  // ---------- upload / drag & drop ----------

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });

  ["dragenter", "dragover"].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", (e) => {
    const dropped = e.dataTransfer.files;
    if (dropped && dropped.length) uploadFile(dropped[0]);
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) uploadFile(fileInput.files[0]);
    fileInput.value = "";
  });

  async function uploadFile(file) {
    setPrintMessage(null, "");
    const form = new FormData();
    form.append("file", file);
    try {
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: authHeaders(),
        body: form,
      });
      if (!res.ok) {
        setPrintMessage("error", await extractError(res, "Upload failed"));
        return;
      }
      const data = await res.json();
      files.unshift(data);
      renderFileList();
      selectFile(data);
    } catch (err) {
      setPrintMessage("error", "Upload failed: " + err);
    }
  }

  async function refreshFileList() {
    try {
      const res = await fetch("/api/files", { headers: authHeaders() });
      if (!res.ok) return;
      files = await res.json();
      if (selectedFile && !files.some((f) => f.id === selectedFile.id)) {
        selectFile(null);
        return;
      }
      renderFileList();
    } catch (err) { /* ignore */ }
  }

  function matchesFilters(f) {
    const wantProcessed = filterProcessed.value;
    if (wantProcessed === "processed" && !f.processed) return false;
    if (wantProcessed === "unprocessed" && f.processed) return false;

    if (f.created_at) {
      const created = f.created_at.slice(0, 10); // YYYY-MM-DD
      if (filterFrom.value && created < filterFrom.value) return false;
      if (filterTo.value && created > filterTo.value) return false;
    }
    return true;
  }

  function renderFileList() {
    fileListEl.innerHTML = "";
    files.filter(matchesFilters).forEach((f) => {
      const tr = document.createElement("tr");
      if (selectedFile && selectedFile.id === f.id) tr.className = "selected";
      tr.addEventListener("click", () => selectFile(f));

      const fileTd = document.createElement("td");
      const nameEl = document.createElement("div");
      nameEl.className = "file-name";
      nameEl.textContent = f.filename;
      fileTd.appendChild(nameEl);

      const storedEl = document.createElement("div");
      storedEl.className = "file-stored small muted";
      storedEl.textContent = f.stored_name ? `${f.type} · ${f.stored_name}` : f.type;
      fileTd.appendChild(storedEl);
      tr.appendChild(fileTd);

      const statusTd = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + (f.processed ? "tone-ok" : "tone-neutral");
      badge.textContent = f.processed ? "Printed" : "Not printed";
      statusTd.appendChild(badge);
      tr.appendChild(statusTd);

      const actionsTd = document.createElement("td");
      actionsTd.className = "actions";

      const hideBtn = document.createElement("button");
      hideBtn.className = "btn ghost small";
      hideBtn.type = "button";
      hideBtn.title = "Hide file";
      hideBtn.textContent = "Hide";
      hideBtn.addEventListener("click", (e) => { e.stopPropagation(); hideFile(f); });
      actionsTd.appendChild(hideBtn);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "btn danger small";
      deleteBtn.type = "button";
      deleteBtn.title = "Delete file";
      deleteBtn.textContent = "Delete";
      deleteBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteFile(f); });
      actionsTd.appendChild(deleteBtn);

      tr.appendChild(actionsTd);
      fileListEl.appendChild(tr);
    });
  }

  async function hideFile(f) {
    if (!confirm(`Hide "${f.filename}"? It will no longer be shown here.`)) return;
    try {
      const res = await fetch(`/api/file/${f.id}/hide`, { method: "POST", headers: authHeaders() });
      if (!res.ok) {
        alert(await extractError(res, "Could not hide file"));
        return;
      }
      files = files.filter((x) => x.id !== f.id);
      if (selectedFile && selectedFile.id === f.id) selectFile(null);
      renderFileList();
    } catch (err) {
      alert("Could not hide file: " + err);
    }
  }

  async function deleteFile(f) {
    if (!confirm(`Delete "${f.filename}"? This cannot be undone.`)) return;
    try {
      const res = await fetch(`/api/file/${f.id}`, { method: "DELETE", headers: authHeaders() });
      if (!res.ok) {
        alert(await extractError(res, "Could not delete file"));
        return;
      }
      files = files.filter((x) => x.id !== f.id);
      if (selectedFile && selectedFile.id === f.id) selectFile(null);
      renderFileList();
    } catch (err) {
      alert("Could not delete file: " + err);
    }
  }

  filterProcessed.addEventListener("change", renderFileList);
  filterFrom.addEventListener("change", renderFileList);
  filterTo.addEventListener("change", renderFileList);

  // ---------- preview + rotation ----------

  function selectFile(f) {
    selectedFile = f;
    rotation = 0;
    printBtn.disabled = !f;
    setPrintMessage(null, "");
    renderFileList();
    renderPreview();
  }

  function renderPreview() {
    previewEmpty.style.display = "none";
    previewFrame.style.display = "none";
    previewImage.style.display = "none";

    if (!selectedFile) {
      previewEmpty.style.display = "block";
      return;
    }

    const src = `/api/file/${selectedFile.id}${authQuery()}`;
    const transform = `rotate(${rotation}deg)`;

    if (selectedFile.type === "pdf") {
      previewFrame.src = src;
      previewFrame.style.display = "block";
      previewFrame.style.transform = transform;
    } else if (["png", "jpg", "jpeg"].includes(selectedFile.type)) {
      previewImage.src = src;
      previewImage.style.display = "inline-block";
      previewImage.style.transform = transform;
    } else {
      previewEmpty.textContent = "No preview available for this file type.";
      previewEmpty.style.display = "block";
    }
  }

  rotateLeftBtn.addEventListener("click", () => {
    rotation = (rotation - 90 + 360) % 360;
    renderPreview();
  });
  rotateRightBtn.addEventListener("click", () => {
    rotation = (rotation + 90) % 360;
    renderPreview();
  });

  // ---------- print ----------

  printBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    printBtn.disabled = true;
    setPrintMessage("info", "Sending to printer…");

    try {
      const res = await fetch("/api/print", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify({
          id: selectedFile.id,
          rotation: rotation,
          paper: paperSelect.value,
          copies: parseInt(copiesInput.value, 10) || 1,
        }),
      });
      if (!res.ok) {
        setPrintMessage("error", await extractError(res, "Print failed"));
      } else {
        const data = await res.json();
        setPrintMessage("success", "Sent to printer (" + (data.job || "job submitted") + ")");
      }
    } catch (err) {
      setPrintMessage("error", "Print failed: " + err);
    } finally {
      printBtn.disabled = false;
    }
  });

  // ---------- printer status polling ----------

  async function pollStatus() {
    try {
      const res = await fetch("/api/printer-status", { headers: authHeaders() });
      if (!res.ok) {
        setStatus("red", await extractError(res, `Status check failed (HTTP ${res.status})`));
        return;
      }
      const data = await res.json();
      if (!data || !data.color) {
        setStatus("red", "Unexpected status response");
        console.error("printer-status returned unexpected payload:", data);
        return;
      }
      setStatus(data.color, data.message || "");
    } catch (err) {
      setStatus("red", "No connection with server");
      console.error("printer-status fetch threw:", err);
    }
  }

  // Server colors -> milessic tone classes (always shown with the text label).
  const STATUS_TONES = { green: "tone-ok", yellow: "tone-warn", red: "tone-fail" };

  function setStatus(color, message) {
    statusBadge.className = "badge " + (STATUS_TONES[color] || "tone-neutral");
    statusBadge.textContent = message || "Unknown";
    statusBadge.title = message || "";
  }

  function startStatusPolling() {
    pollStatus();
    stopStatusPolling();
    statusTimer = setInterval(pollStatus, 5000);
  }
  function stopStatusPolling() {
    if (statusTimer) clearInterval(statusTimer);
    statusTimer = null;
  }

  // ---------- own file list polling (meta file) ----------

  function startFileListPolling() {
    refreshFileList();
    stopFileListPolling();
    fileListTimer = setInterval(refreshFileList, 5000);
  }
  function stopFileListPolling() {
    if (fileListTimer) clearInterval(fileListTimer);
    fileListTimer = null;
  }
})();
</script>
</body>
</html>
